<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>蛋鸭</title>
    <style>
        body { 
            margin: 0;
            overflow: hidden;
            background: #000;
            touch-action: none;
        }
        #controls {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
            color: white;
            font-family: Arial;
        }
        .color-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            margin: 5px;
            cursor: pointer;
            border: 2px solid white;
        }
    </style>
</head>
<body>
    <div id="controls">
        <div>画笔颜色 ▼</div>
        <div class="color-btn" style="background:#FF3366" onclick="setColor('#FF3366')"></div>
        <div class="color-btn" style="background:#33CCFF" onclick="setColor('#33CCFF')"></div>
        <div class="color-btn" style="background:#FFEE33" onclick="setColor('#FFEE33')"></div>
        <button onclick="clearCanvas()" style="margin-top:10px">清空画布</button>
    </div>
    
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let currentColor = '#FF3366';
        
        // 初始化画布
        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // 粒子系统
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.size = Math.random() * 3 + 1;
                this.speedX = (Math.random() - 0.5) * 2;
                this.speedY = (Math.random() - 0.5) * 2;
                this.alpha = 1;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.alpha -= 0.008;
                if(this.alpha < 0) this.alpha = 0;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        let particles = [];
        
        // 绘制逻辑
        function createParticles(x, y) {
            for(let i = 0; i < 5; i++) {
                particles.push(new Particle(x, y, currentColor));
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach((particle, index) => {
                particle.update();
                particle.draw();
                if(particle.alpha <= 0) {
                    particles.splice(index, 1);
                }
            });
            requestAnimationFrame(animate);
        }

        // 交互事件
        canvas.addEventListener('mousedown', () => isDrawing = true);
        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mousemove', (e) => {
            if(isDrawing) createParticles(e.clientX, e.clientY);
        });

        // 移动端支持
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            isDrawing = true;
        }, { passive: false });
        canvas.addEventListener('touchend', () => isDrawing = false);
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if(isDrawing) {
                const touch = e.touches[0];
                createParticles(touch.clientX, touch.clientY);
            }
        }, { passive: false });

        // 控制函数
        function setColor(color) {
            currentColor = color;
        }

        function clearCanvas() {
            particles = [];
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // 初始化
        init();
        animate();
        window.addEventListener('resize', init);
    </script>
</body>
</html>
